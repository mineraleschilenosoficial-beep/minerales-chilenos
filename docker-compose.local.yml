services:
  db:
    image: postgres:16-alpine
    container_name: minerales-local-db
    environment:
      POSTGRES_DB: minerales
      POSTGRES_USER: minerales
      POSTGRES_PASSWORD: minerales
    ports:
      - "5432:5432"
    volumes:
      - minerales_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minerales -d minerales"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  minerales_pgdata:
